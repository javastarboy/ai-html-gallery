<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品卡片展示</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen p-8">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold text-white mb-8 text-center">精选产品</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Product Card 1 -->
      <div class="group relative bg-gray-800 rounded-2xl overflow-hidden shadow-xl transition-all duration-300 hover:shadow-2xl hover:-translate-y-2">
        <div class="aspect-square bg-gradient-to-br from-blue-500 to-cyan-400 relative overflow-hidden">
          <div class="absolute inset-0 flex items-center justify-center text-9xl opacity-30">
            🎧
          </div>
          <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors duration-300 flex items-center justify-center">
            <button class="opacity-0 group-hover:opacity-100 transform scale-90 group-hover:scale-100 transition-all duration-300 bg-white text-gray-900 px-6 py-3 rounded-full font-semibold">
              快速查看
            </button>
          </div>
          <div class="absolute top-4 right-4 bg-red-500 text-white px-3 py-1 rounded-full text-sm font-medium">
            -20%
          </div>
        </div>
        <div class="p-6">
          <div class="text-sm text-blue-400 mb-2">电子产品</div>
          <h3 class="text-xl font-bold text-white mb-2">无线降噪耳机</h3>
          <p class="text-gray-400 text-sm mb-4">专业级降噪技术，40小时超长续航</p>
          <div class="flex items-center justify-between">
            <div>
              <span class="text-2xl font-bold text-white">¥899</span>
              <span class="text-gray-500 line-through text-sm ml-2">¥1124</span>
            </div>
            <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition-colors">
              加入购物车
            </button>
          </div>
        </div>
      </div>

      <!-- Product Card 2 -->
      <div class="group relative bg-gray-800 rounded-2xl overflow-hidden shadow-xl transition-all duration-300 hover:shadow-2xl hover:-translate-y-2">
        <div class="aspect-square bg-gradient-to-br from-purple-500 to-pink-400 relative overflow-hidden">
          <div class="absolute inset-0 flex items-center justify-center text-9xl opacity-30">
            ⌚
          </div>
          <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors duration-300 flex items-center justify-center">
            <button class="opacity-0 group-hover:opacity-100 transform scale-90 group-hover:scale-100 transition-all duration-300 bg-white text-gray-900 px-6 py-3 rounded-full font-semibold">
              快速查看
            </button>
          </div>
        </div>
        <div class="p-6">
          <div class="text-sm text-purple-400 mb-2">智能穿戴</div>
          <h3 class="text-xl font-bold text-white mb-2">智能手表 Pro</h3>
          <p class="text-gray-400 text-sm mb-4">健康监测、运动追踪、NFC支付</p>
          <div class="flex items-center justify-between">
            <div>
              <span class="text-2xl font-bold text-white">¥1999</span>
            </div>
            <button class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg transition-colors">
              加入购物车
            </button>
          </div>
        </div>
      </div>

      <!-- Product Card 3 -->
      <div class="group relative bg-gray-800 rounded-2xl overflow-hidden shadow-xl transition-all duration-300 hover:shadow-2xl hover:-translate-y-2">
        <div class="aspect-square bg-gradient-to-br from-orange-500 to-yellow-400 relative overflow-hidden">
          <div class="absolute inset-0 flex items-center justify-center text-9xl opacity-30">
            📱
          </div>
          <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors duration-300 flex items-center justify-center">
            <button class="opacity-0 group-hover:opacity-100 transform scale-90 group-hover:scale-100 transition-all duration-300 bg-white text-gray-900 px-6 py-3 rounded-full font-semibold">
              快速查看
            </button>
          </div>
          <div class="absolute top-4 left-4 bg-green-500 text-white px-3 py-1 rounded-full text-sm font-medium">
            新品
          </div>
        </div>
        <div class="p-6">
          <div class="text-sm text-orange-400 mb-2">智能手机</div>
          <h3 class="text-xl font-bold text-white mb-2">旗舰手机 Max</h3>
          <p class="text-gray-400 text-sm mb-4">6.7英寸AMOLED屏，1亿像素摄像头</p>
          <div class="flex items-center justify-between">
            <div>
              <span class="text-2xl font-bold text-white">¥4999</span>
            </div>
            <button class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg transition-colors">
              加入购物车
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
